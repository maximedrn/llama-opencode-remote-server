worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_method $uri $status '
        '$body_bytes_sent rt=$request_time';

    access_log /dev/stdout main;
    server_tokens off;
    keepalive_timeout 65;

    map $http_cf_connecting_ip $client_key {
        default $http_cf_connecting_ip;
        "" $binary_remote_addr;
    }

    limit_req_zone $client_key zone=llm_api:10m rate=10r/s;
    limit_conn_zone $client_key zone=llm_conn:10m;

    upstream llama_upstream {
        server llama:8080;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 64m;
        client_body_timeout 120s;

        send_timeout 3600s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;

        location = /v1/health {
            return 404;
        }

        location = /v1/models {
            return 404;
        }

        location /v1/ {
            limit_req zone=llm_api burst=30 nodelay;
            limit_conn llm_conn 16;
            limit_except GET POST OPTIONS {
                deny all;
            }

            proxy_pass http://llama_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header CF-Access-Client-Id "";
            proxy_set_header CF-Access-Client-Secret "";
            proxy_set_header Cookie "";
            proxy_hide_header Server;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            return 404;
        }
    }
}
