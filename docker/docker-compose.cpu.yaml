services:
  llama:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    # `never` for an image built on this machine: `pull` then skips it instead
    # of failing on a repository that does not exist.
    pull_policy: ${LLAMA_PULL_POLICY:-missing}
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 2048
    security_opt:
      - no-new-privileges:true
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: "8gb"
    tmpfs:
      - /tmp:size=1g,mode=1777
    volumes:
      - type: bind
        source: ${MODEL_DIRECTORY:?Set MODEL_DIRECTORY in .env}
        target: /models
        read_only: true
    secrets:
      - llama_api_key
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-fsS"
        - "http://127.0.0.1:8080/health"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    networks:
      - backend
    command:
      - --device
      - none
      - -m
      - /models/${MODEL_FILE:?Set MODEL_FILE in .env}
      - --alias
      - ${LLAMA_ALIAS:-llama}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${CTX_SIZE:-262144}
      - --parallel
      - "1"
      - --load-mode
      - ${LOAD_MODE:-mmap+mlock}
      - --flash-attn
      - ${FLASH_ATTN:-on}
      - --cache-type-k
      - ${CACHE_TYPE_K:-q8_0}
      - --cache-type-v
      - ${CACHE_TYPE_V:-q8_0}
      - --jinja
      - --cache-prompt
      - --spec-type
      - ngram-simple
      - --spec-draft-n-max
      - ${SPEC_DRAFT_N_MAX:-3}
      - --spec-draft-p-max
      - ${SPEC_DRAFT_P_MAX:-0.7}
      - --batch-size
      - ${BATCH_SIZE:-2048}
      - --ubatch-size
      - ${UBATCH_SIZE:-512}
      - --threads
      - ${THREADS:-8}
      - --threads-batch
      - ${THREADS_BATCH:-16}
      - --no-mmproj
      - --no-ui
      - --metrics
      - --api-key-file
      - /run/secrets/llama_api_key
