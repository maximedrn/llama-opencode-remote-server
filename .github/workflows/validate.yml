name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Code integrity checks
        run: bun run validate

      - name: Create validation-only local files
        run: |
          mkdir -p secrets
          printf 'dummy\n' > secrets/llama_api_key.txt
          printf 'dummy\n' > secrets/cloudflare_tunnel_token.txt
          cp .env.example .env

      - name: Compose validation
        run: bun run validate:compose
